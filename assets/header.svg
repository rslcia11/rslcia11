    <text x="70" y="168" font-size="60" font-weight="800" fill="#FFFFFF">Wilson Martínez</text>
    <text x="72" y="214" font-size="27" font-weight="600" fill="#E1E8E5">Full-stack developer</text>
    <text x="72" y="250" font-size="20" fill="#9DB0A9">Backend, data systems and machine learning.</text>
    <text x="72" y="278" font-size="20" fill="#9DB0A9">From the database to the phone in your hand.</text>
    <g font-size="16" font-weight="700">
      <rect x="72" y="306" width="146" height="36" rx="18" fill="#FFFFFF" fill-opacity=".09"/>
      <text x="145" y="330" fill="#FFFFFF" text-anchor="middle">Loja, Ecuador</text>
