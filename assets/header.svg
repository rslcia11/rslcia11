        <text class="l0" x="676" y="126" xml:space="preserve"><tspan fill="#3FCF8E">~</tspan><tspan fill="#8FA39C"> $ </tspan><tspan fill="#FFFFFF">whoami</tspan></text>
    <text class="l1" x="676" y="155" xml:space="preserve"><tspan fill="#C9D4D0">wilson · full-stack developer · Loja, EC</tspan></text>
    <text class="l2" x="676" y="184" xml:space="preserve"><tspan fill="#3FCF8E">~</tspan><tspan fill="#8FA39C"> $ </tspan><tspan fill="#FFFFFF">cat stack.txt</tspan></text>
    <text class="l3" x="676" y="213" xml:space="preserve"><tspan fill="#F2B33D">backend </tspan><tspan fill="#C9D4D0">  FastAPI · NestJS · Django</tspan></text>
    <text class="l4" x="676" y="242" xml:space="preserve"><tspan fill="#F2B33D">frontend</tspan><tspan fill="#C9D4D0">  React · Next.js · TypeScript</tspan></text>
    <text class="l5" x="676" y="271" xml:space="preserve"><tspan fill="#F2B33D">data/ml </tspan><tspan fill="#C9D4D0">  PostgreSQL · TimescaleDB · LightGBM</tspan></text>
    <text class="l6" x="676" y="300" xml:space="preserve"><tspan fill="#F2B33D">mobile  </tspan><tspan fill="#C9D4D0">  Flutter · Supabase</tspan></text>
    <text class="l7" x="676" y="329" xml:space="preserve"><tspan fill="#3FCF8E">~</tspan><tspan fill="#8FA39C"> $ </tspan><tspan fill="#FFFFFF">docker compose up -d</tspan></text>
    <text class="l8" x="676" y="358" xml:space="preserve"><tspan fill="#3FCF8E">✓ api  ✓ db  ✓ worker   running</tspan></text>
    <g class="cur"><text x="676" y="387"><tspan fill="#3FCF8E">~</tspan><tspan fill="#8FA39C"> $ </tspan></text><rect class="blink" x="720" y="371" width="10" height="20" fill="#3FCF8E"/></g>
