<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Wilson Martínez, full-stack developer: backend, data systems and machine learning">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity=".07"/></pattern>
    <radialGradient id="g1"><stop offset="0" stop-color="#0B6E5E" stop-opacity=".7"/><stop offset="1" stop-color="#0B6E5E" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#F2B33D" stop-opacity=".22"/><stop offset="1" stop-color="#F2B33D" stop-opacity="0"/></radialGradient>
    <style>
      .halo { animation: breathe 6s ease-in-out infinite; }
      .halo2 { animation: breathe 6s ease-in-out 3s infinite; }
      .term { animation: float 7s ease-in-out infinite; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      @keyframes breathe { 50% { opacity: .35; } }
      @keyframes float { 50% { transform: translateY(-6px); } }
      @keyframes pulse { 50% { opacity: .3; } }
      @keyframes k0{0%,4.0%{opacity:0}5.2%,88%{opacity:1}93%,100%{opacity:0}}.l0{animation:k0 16.0s linear infinite}@keyframes k1{0%,9.5%{opacity:0}10.7%,88%{opacity:1}93%,100%{opacity:0}}.l1{animation:k1 16.0s linear infinite}@keyframes k2{0%,15.0%{opacity:0}16.2%,88%{opacity:1}93%,100%{opacity:0}}.l2{animation:k2 16.0s linear infinite}@keyframes k3{0%,20.5%{opacity:0}21.7%,88%{opacity:1}93%,100%{opacity:0}}.l3{animation:k3 16.0s linear infinite}@keyframes k4{0%,26.0%{opacity:0}27.2%,88%{opacity:1}93%,100%{opacity:0}}.l4{animation:k4 16.0s linear infinite}@keyframes k5{0%,31.5%{opacity:0}32.7%,88%{opacity:1}93%,100%{opacity:0}}.l5{animation:k5 16.0s linear infinite}@keyframes k6{0%,37.0%{opacity:0}38.2%,88%{opacity:1}93%,100%{opacity:0}}.l6{animation:k6 16.0s linear infinite}@keyframes k7{0%,42.5%{opacity:0}43.7%,88%{opacity:1}93%,100%{opacity:0}}.l7{animation:k7 16.0s linear infinite}@keyframes k8{0%,48.0%{opacity:0}49.2%,88%{opacity:1}93%,100%{opacity:0}}.l8{animation:k8 16.0s linear infinite}@keyframes kc{0%,53.5%{opacity:0}54.0%,88%{opacity:1}93%,100%{opacity:0}}.cur{animation:kc 16.0s linear infinite}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="1280" height="420" rx="22" fill="#111A17"/>
  <rect width="1280" height="420" rx="22" fill="url(#dots)"/>
  <circle class="halo" cx="230" cy="150" r="300" fill="url(#g1)"/>
  <circle class="halo2" cx="1010" cy="330" r="280" fill="url(#g2)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
