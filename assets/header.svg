      <text x="325" y="330" fill="#FFFFFF" text-anchor="middle">Shipping since 2023</text>
      <rect x="432" y="306" width="180" height="36" rx="18" fill="#F2B33D"/>
      <circle class="dot" cx="454" cy="324" r="5" fill="#111A17"/>
      <text x="532" y="330" fill="#111A17" text-anchor="middle">Building Kriterio</text>
    </g>
  </g>

  <g transform="translate(0 -16)"><g class="term" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17">
    <rect x="650" y="46" width="580" height="358" rx="14" fill="#0A100E" stroke="#FFFFFF" stroke-opacity=".12"/>
    <path d="M650 60a14 14 0 0 1 14-14h552a14 14 0 0 1 14 14v26h-580z" fill="#FFFFFF" fill-opacity=".05"/>
    <circle cx="672" cy="66" r="6" fill="#FF5F57"/>
    <circle cx="692" cy="66" r="6" fill="#FEBC2E"/>
    <circle cx="712" cy="66" r="6" fill="#28C840"/>
